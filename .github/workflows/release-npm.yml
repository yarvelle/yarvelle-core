name: Release NPM Packages

on:
  push:
    tags:
      - 'v*'
      - 'ui-v*'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry run — build and package only (do not publish to registry)'
        required: false
        default: false
        type: boolean
      version:
        description: 'Override version (e.g. 0.1.0). Leave empty to use tag or package.json'
        required: false
        default: ''
        type: string

# npm trusted publishing (OIDC): npmjs.com must list this repository and the
# workflow file "release-npm.yml" (no environment) as the package's trusted
# publisher. No npm token is used; npm adds provenance automatically.
permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    name: Build & Publish @yarvelle/ui to NPM
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Use npm with trusted publishing support (>= 11.5.1)
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Build and Publish @yarvelle/ui
        working-directory: frontend
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.version }}" ]; then
            npm version "${{ github.event.inputs.version }}" --no-git-tag-version --allow-same-version
          elif [[ "$GITHUB_REF_NAME" =~ ^(ui-)?v?[0-9] ]]; then
            VERSION="${GITHUB_REF_NAME#ui-}"
            VERSION="${VERSION#v}"
            npm version "$VERSION" --no-git-tag-version --allow-same-version
          fi
          pnpm install --no-frozen-lockfile
          pnpm run build
          npm pack --dry-run
          CURRENT_VER=$(node -p "require('./package.json').version")
          if [ "${{ github.event.inputs.dryRun }}" = "true" ]; then
            npm publish --access public --dry-run
          elif npm view "@yarvelle/ui@$CURRENT_VER" version >/dev/null 2>&1; then
            echo "Version $CURRENT_VER of @yarvelle/ui is already published on npm. Skipping publish."
          else
            # Any publish error (for example E404 or ENEEDAUTH) fails the job.
            npm publish --access public
          fi
