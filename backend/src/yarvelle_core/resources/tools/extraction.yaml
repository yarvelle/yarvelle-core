apiVersion: yarvelle.tools/v1
kind: ToolSet
pack_id: core
tools:
  - name: sanitize_pii
    category: extraction
    risk_tier: read
    trust: trusted
    data_sensitivity: pii
    description: Mask direct PII (national ID, account identifiers, phone, address, email) in text before processing.
    input_schema:
      type: object
      properties:
        text:
          type: string
          description: Source text to mask.
        mask_type:
          type: string
          description: "'tag' or 'redacted'."
      required:
        - text
    binding:
      kind: handler
      entrypoint: yarvelle_core.tools.builtin_handlers:exec_sanitize_pii

  - name: extract_structured_data
    category: extraction
    risk_tier: read
    trust: trusted
    data_sensitivity: confidential
    description: Extract structured data from text into a typed Pydantic schema.
    input_schema:
      type: object
      properties:
        text:
          type: string
          description: Sanitized document text.
        schema_type:
          type: string
          description: "'insurance', 'records', or 'generic'."
      required:
        - text
    binding:
      kind: handler
      entrypoint: yarvelle_core.tools.builtin_handlers:exec_extract_structured_data

  - name: validate_grounding
    category: extraction
    risk_tier: read
    trust: trusted
    data_sensitivity: confidential
    description: Validate that extracted numerical values match source document text.
    input_schema:
      type: object
      properties:
        dossier:
          description: Extracted dossier dictionary or model.
        source_text:
          type: string
          description: Raw un-sanitized source text.
      required:
        - dossier
        - source_text
    binding:
      kind: handler
      entrypoint: yarvelle_core.tools.builtin_handlers:exec_validate_grounding

  - name: extract_document_dossier
    category: extraction
    risk_tier: read
    trust: trusted
    data_sensitivity: confidential
    description: "Composite pipeline: ingestion, PII sanitization, schema extraction, and grounding."
    input_schema:
      type: object
      properties:
        file_path:
          type: string
          description: Relative path in attachments/.
        document_text:
          type: string
          description: Raw document text if loaded.
        dossier_type:
          type: string
          description: "'insurance', 'records', or 'generic'."
    binding:
      kind: handler
      entrypoint: yarvelle_core.tools.builtin_handlers:exec_extract_document_dossier
