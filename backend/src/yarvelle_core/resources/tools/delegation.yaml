apiVersion: yarvelle.tools/v1
kind: ToolSet
pack_id: core
tools:
  - name: delegate_to_agent
    category: delegation
    risk_tier: read
    trust: trusted
    data_sensitivity: internal
    description: Delegate the user's request to a specialist agent by ID, providing instructions.
    input_schema:
      type: object
      properties:
        agent_id:
          type: string
          description: Target specialist agent ID.
        instructions:
          type: string
          description: Instructions for specialist agent.
      required:
        - agent_id
    binding:
      kind: handler
      entrypoint: yarvelle_core.tools.builtin_handlers:exec_delegate_to_agent

  - name: list_agents
    category: delegation
    risk_tier: read
    trust: trusted
    data_sensitivity: public
    description: Search the available specialist agents and their capabilities in the catalog.
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: Optional keywords; empty lists all agents.
        limit:
          type: integer
          minimum: 1
          maximum: 50
    binding:
      kind: handler
      entrypoint: yarvelle_core.tools.builtin_handlers:exec_list_agents
