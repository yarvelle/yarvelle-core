apiVersion: yarvelle.tools/v1
kind: ToolSet
pack_id: core
tools:
  - name: web_search
    category: web
    risk_tier: read
    trust: untrusted
    data_sensitivity: public
    allowed_hosts:
      - api.search.brave.com
      - localhost
      - 127.0.0.1
      - searx.be
    context_params: [profile_id, user_id]
    description: >-
      Execute a privacy-preserving, PII-sanitised web search via allowlisted SearXNG
      or Brave Search endpoints. Automatically strips user names, date of birth,
      national identifiers, phone, email, and address before any outbound request
      and marks results untrusted.
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: Search query string (sanitised of personal identifiers before sending).
        provider:
          type: string
          enum: [searxng, brave]
          default: searxng
          description: "Search provider ('searxng' or 'brave')."
        limit:
          type: integer
          default: 5
          minimum: 1
          maximum: 10
          description: Maximum number of search results to return.
        preview_only:
          type: boolean
          default: false
          description: If true, returns only the sanitised query preview without network I/O.
      required:
        - query
    metadata:
      action: web_search
      risk: read
      taints_context: true
    binding:
      kind: handler
      entrypoint: yarvelle_core.tools.builtin_handlers:exec_web_search
