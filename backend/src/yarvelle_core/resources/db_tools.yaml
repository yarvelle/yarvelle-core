# ============================================================================
# Yarvelle Core Declarative & Dynamic MCP Database Toolbox Configuration
# Dialect-agnostic SQL specification supporting SQLite, PostgreSQL, MySQL,
# MariaDB, MS SQL Server, and DuckDB, paired with dynamic AST-sandboxed DQL/DML.
# ============================================================================

sources:
  yarvelle-db:
    kind: sql
    database_env: DATABASE_URL
    description: >-
      Primary Yarvelle Core relational database source supporting any SQLAlchemy
      dialect (SQLite, PostgreSQL, MySQL/MariaDB, MS SQL Server, DuckDB).
  yarvelle-sqlite:
    kind: sqlite
    database_env: DATABASE_URL
    description: Local SQLite database alias for backward compatibility.
  yarvelle-postgres:
    kind: postgres
    database_env: DATABASE_URL
    description: PostgreSQL database alias for server/cloud deployments.
  yarvelle-mysql:
    kind: mysql
    database_env: DATABASE_URL
    description: MySQL / MariaDB relational database source.
  yarvelle-mssql:
    kind: mssql
    database_env: DATABASE_URL
    description: Microsoft SQL Server (T-SQL) relational database source.
  yarvelle-duckdb:
    kind: duckdb
    database_env: DATABASE_URL
    description: DuckDB analytical SQL database source.

tools:
  upsert_workspace_note:
    kind: sql
    source: yarvelle-db
    risk_tier: write_local
    entity: note
    description: >-
      Create or update a profile-scoped workspace note, checklist, or structured
      markdown summary in the notes table.
    statement: |
      INSERT INTO notes (
        id, type, user_id, profile_id, scope, slug, title, content, tags_json, locale, linked_appointment_id, created_at, updated_at
      ) VALUES (
        :id, :type, :user_id, :profile_id, :scope, :slug, :title, :content, :tags_json, :locale, :linked_appointment_id, :now, :now
      )
      ON CONFLICT(id) DO UPDATE SET
        type = excluded.type,
        title = excluded.title,
        content = excluded.content,
        tags_json = excluded.tags_json,
        locale = excluded.locale,
        linked_appointment_id = excluded.linked_appointment_id,
        updated_at = excluded.updated_at
      RETURNING id, slug, title, type, scope, profile_id, locale, updated_at;
    parameters:
      - name: slug
        type: string
        description: Unique URL-safe slug identifier for the note (e.g. 'weekly-review-2026-10').
        required: true
      - name: title
        type: string
        description: Human-readable title of the note.
        required: true
      - name: content
        type: string
        description: Markdown body of the note.
        required: true
      - name: type
        type: string
        description: Note category ('scratchpad', 'prep', 'summary', 'general').
        required: false
        default: "scratchpad"
      - name: tags_json
        type: string
        description: JSON array string of taxonomy tags (e.g. '["planning", "q4"]').
        required: false
        default: "[]"
      - name: locale
        type: string
        description: IETF BCP 47 locale tag of the note content (e.g. 'en-US').
        required: false
        default: "en-US"
      - name: linked_appointment_id
        type: string
        description: Optional linked entity or event UUID.
        required: false
        default: ""

  list_workspace_notes:
    kind: sql
    source: yarvelle-db
    risk_tier: read
    entity: note
    description: >-
      List recent profile-scoped workspace notes, optionally filtered by note type.
    statement: |
      SELECT id, slug, title, type, scope, tags_json, locale, linked_appointment_id, created_at, updated_at
      FROM notes
      WHERE profile_id = :profile_id
        AND (:type = '' OR type = :type)
      ORDER BY updated_at DESC
      LIMIT :limit;
    parameters:
      - name: type
        type: string
        description: Optional note category filter ('scratchpad', 'prep', 'summary', 'general').
        required: false
        default: ""
      - name: limit
        type: integer
        description: Maximum number of notes to return (1 to 100).
        required: false
        default: 20

  get_workspace_note:
    kind: sql
    source: yarvelle-db
    risk_tier: read
    entity: note
    description: >-
      Retrieve the full markdown content and metadata of a specific workspace note by slug or ID.
    statement: |
      SELECT id, slug, title, type, scope, content, tags_json, locale, linked_appointment_id, created_at, updated_at
      FROM notes
      WHERE profile_id = :profile_id
        AND (slug = :identifier OR id = :identifier)
      ORDER BY updated_at DESC
      LIMIT 1;
    parameters:
      - name: identifier
        type: string
        description: Note slug or UUID identifier.
        required: true

  delete_workspace_note:
    kind: sql
    source: yarvelle-db
    risk_tier: irreversible
    entity: note
    description: >-
      Delete a specific workspace note belonging to the active profile by slug or ID.
    statement: |
      DELETE FROM notes
      WHERE profile_id = :profile_id
        AND (slug = :identifier OR id = :identifier)
      RETURNING id, slug, title;
    parameters:
      - name: identifier
        type: string
        description: Note slug or UUID identifier to delete.
        required: true

  create_profile_reminder:
    kind: sql
    source: yarvelle-db
    risk_tier: write_local
    entity: reminder
    description: >-
      Create a scheduled one-shot or recurring RFC 5545 RRULE reminder for the active profile.
    statement: |
      INSERT INTO reminders (
        id, profile_id, scope, title, description, category, rrule, timezone, next_due_at, status, created_at, updated_at
      ) VALUES (
        :id, :profile_id, :scope, :title, :description, :category, :rrule, :timezone, :next_due_at, 'pending', :now, :now
      )
      RETURNING id, profile_id, scope, title, category, rrule, timezone, next_due_at, status, created_at;
    parameters:
      - name: title
        type: string
        description: Reminder prompt or directive title.
        required: true
      - name: next_due_at
        type: string
        description: ISO-8601 UTC timestamp for next scheduled trigger.
        required: true
      - name: description
        type: string
        description: Optional detailed context or instructions.
        required: false
        default: ""
      - name: category
        type: string
        description: Reminder category ('task', 'event', 'prep', 'general').
        required: false
        default: "general"
      - name: rrule
        type: string
        description: Optional RFC 5545 recurrence rule (e.g. 'FREQ=DAILY;INTERVAL=1').
        required: false
        default: ""
      - name: timezone
        type: string
        description: Local IANA timezone identifier (e.g. 'UTC', 'America/Chicago').
        required: false
        default: "UTC"

  list_profile_reminders:
    kind: sql
    source: yarvelle-db
    risk_tier: read
    entity: reminder
    description: >-
      List scheduled reminders for the active profile, optionally filtered by status or category.
    statement: |
      SELECT id, profile_id, scope, title, description, category, rrule, timezone, next_due_at, status, snooze_until, last_triggered_at, updated_at
      FROM reminders
      WHERE profile_id = :profile_id
        AND (:status = '' OR status = :status)
        AND (:category = '' OR category = :category)
      ORDER BY next_due_at ASC
      LIMIT :limit;
    parameters:
      - name: status
        type: string
        description: Optional status filter ('pending', 'completed', 'snoozed', 'missed', 'cancelled').
        required: false
        default: ""
      - name: category
        type: string
        description: Optional category filter ('task', 'event', 'prep', 'general').
        required: false
        default: ""
      - name: limit
        type: integer
        description: Maximum number of reminders to return (1 to 100).
        required: false
        default: 25

  update_profile_reminder:
    kind: sql
    source: yarvelle-db
    risk_tier: write_local
    entity: reminder
    description: >-
      Update the status, next_due_at, or snooze_until timestamp of an existing profile reminder.
    statement: |
      UPDATE reminders
      SET status = :status,
          next_due_at = COALESCE(NULLIF(:next_due_at, ''), next_due_at),
          snooze_until = NULLIF(:snooze_until, ''),
          updated_at = :now
      WHERE id = :reminder_id
        AND profile_id = :profile_id
      RETURNING id, profile_id, title, category, status, next_due_at, snooze_until, updated_at;
    parameters:
      - name: reminder_id
        type: string
        description: Unique UUID of the reminder to update.
        required: true
      - name: status
        type: string
        description: New status ('pending', 'completed', 'snoozed', 'missed', 'cancelled').
        required: true
      - name: next_due_at
        type: string
        description: Optional updated ISO-8601 UTC due timestamp.
        required: false
        default: ""
      - name: snooze_until
        type: string
        description: Optional ISO-8601 UTC timestamp until which the reminder is snoozed.
        required: false
        default: ""

  create_email_draft_record:
    kind: sql
    source: yarvelle-db
    risk_tier: write_local
    entity: email_draft
    description: >-
      Persist a local email draft in the database for user review. Never sends email automatically.
    statement: |
      INSERT INTO email_drafts (
        id, profile_id, scope, recipient, subject, body, category, status, created_at, updated_at
      ) VALUES (
        :id, :profile_id, :scope, :recipient, :subject, :body, :category, 'draft', :now, :now
      )
      RETURNING id, profile_id, scope, recipient, subject, category, status, created_at;
    parameters:
      - name: subject
        type: string
        description: Email subject line.
        required: true
      - name: body
        type: string
        description: Email plaintext body.
        required: true
      - name: recipient
        type: string
        description: Optional recipient email address.
        required: false
        default: ""
      - name: category
        type: string
        description: Draft category ('appointment', 'school', 'records', 'general').
        required: false
        default: "general"

  list_email_draft_records:
    kind: sql
    source: yarvelle-db
    risk_tier: read
    entity: email_draft
    description: >-
      List saved local email drafts for the active profile, optionally filtered by status.
    statement: |
      SELECT id, profile_id, scope, recipient, subject, category, status, sent_at, created_at, updated_at
      FROM email_drafts
      WHERE profile_id = :profile_id
        AND (:status = '' OR status = :status)
      ORDER BY updated_at DESC
      LIMIT :limit;
    parameters:
      - name: status
        type: string
        description: Optional draft status filter ('draft', 'exported', 'sent_via_approved_mcp', 'archived').
        required: false
        default: ""
      - name: limit
        type: integer
        description: Maximum number of email drafts to return.
        required: false
        default: 20

