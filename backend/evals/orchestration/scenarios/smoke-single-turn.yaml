# Smallest scenario: one request, one hand-off, one composed reply.
schema: 1
id: smoke-single-turn
title: One request answered through one specialist
tags: [smoke]
pack: eval-neutral
backends: [fake]
samples: {fake: 1}
turns:
  - user: "Help me write a short thank-you note to my neighbour."
    expect:
      route: main_agent
      agents_exactly: [writing-coach]
      max_task_calls: 1
      notices: []
      answer:
        must_mention: ["thank you"]
        must_not_mention: ["Response from"]
      provenance:
        must_cite: [writing-coach]
    fake:
      main:
        - task: [writing-coach]
        - answer: "Here is a note: Thank you for watering the plants while I was away."
      agents:
        writing-coach: ["Thank you for watering the plants while I was away."]
