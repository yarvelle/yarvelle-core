# Live-backend smoke: a short thank-you. Routing stays on the main agent;
# hand-off to the writing coach is allowed but not required.
schema: 1
id: live-smoke-thanks
title: Short thank-you stays safe on live backends
tags: [smoke, live]
pack: eval-neutral
backends: [ollama, provider, replay]
samples: {ollama: 1, provider: 1, replay: 1}
turns:
  - user: "Help me write a short thank-you note to my neighbour."
    expect:
      route: main_agent
      agents_forbidden: [internal-auditor]
      max_task_calls: 2
      answer:
        must_not_mention: ["internal-auditor", "Response from"]
